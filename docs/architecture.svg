<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="1080" height="640" fill="#f8fafc"/>

  <!-- Title -->
  <text x="540" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">llm-gateway — request flow</text>
  <text x="540" y="60" text-anchor="middle" font-size="13" fill="#64748b">applications may only know the gateway; providers &amp; clients are DB rows</text>

  <!-- Client -->
  <rect x="40" y="250" width="140" height="60" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="110" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">App / Agent</text>
  <text x="110" y="294" text-anchor="middle" font-size="11" fill="#475569">POST /v1/chat</text>

  <!-- Gateway cluster -->
  <rect x="240" y="70" width="360" height="340" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-dasharray="5 3"/>
  <text x="420" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">gateway (Express, node:20)</text>

  <!-- Auth -->
  <rect x="270" y="110" width="300" height="54" rx="8" fill="#ffffff" stroke="#3b82f6"/>
  <text x="420" y="133" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">1 · Auth</text>
  <text x="420" y="152" text-anchor="middle" font-size="11" fill="#475569">sha256(x-api-key) ⚡ api_clients (Postgres)</text>

  <!-- Rate limit -->
  <rect x="270" y="190" width="300" height="54" rx="8" fill="#ffffff" stroke="#3b82f6"/>
  <text x="420" y="213" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">2 · Rate limit (token bucket)</text>
  <text x="420" y="232" text-anchor="middle" font-size="11" fill="#475569">Redis Lua, atomic · fails open · 429 + Retry-After</text>

  <!-- Router / failover -->
  <rect x="270" y="270" width="300" height="54" rx="8" fill="#ffffff" stroke="#3b82f6"/>
  <text x="420" y="293" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">3 · Failover router + adapters</text>
  <text x="420" y="312" text-anchor="middle" font-size="11" fill="#475569">providers by priority · circuit-breaker gate · openai/flat</text>

  <!-- Redis -->
  <rect x="40" y="470" width="140" height="60" rx="8" fill="#fdf4ff" stroke="#9333ea"/>
  <text x="110" y="496" text-anchor="middle" font-size="13" font-weight="bold" fill="#701a75">Redis</text>
  <text x="110" y="514" text-anchor="middle" font-size="11" fill="#86198f">circuit:{id} · bucket:{id}</text>

  <!-- Postgres -->
  <rect x="240" y="470" width="300" height="60" rx="8" fill="#ecfdf5" stroke="#16a34a"/>
  <text x="390" y="496" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">Postgres (source of truth)</text>
  <text x="390" y="514" text-anchor="middle" font-size="11" fill="#15803d">api_clients · providers · request_log</text>

  <!-- Providers -->
  <rect x="700" y="110" width="320" height="54" rx="8" fill="#ffffff" stroke="#0ea5e9"/>
  <text x="860" y="133" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">GROQ — priority 50</text>
  <text x="860" y="152" text-anchor="middle" font-size="11" fill="#475569">openai shape · no provider outage = fast path</text>

  <rect x="700" y="190" width="320" height="54" rx="8" fill="#ffffff" stroke="#0ea5e9"/>
  <text x="860" y="213" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">MOCK — priority 200 (failover)</text>
  <text x="860" y="232" text-anchor="middle" font-size="11" fill="#475569">flat shape · Docker demo/fixture provider</text>

  <rect x="700" y="270" width="320" height="54" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="860" y="293" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Next provider (insert a row)</text>
  <text x="860" y="312" text-anchor="middle" font-size="11" fill="#475569">any base_url · no code/rebuild required</text>

  <!-- Metrics -->
  <rect x="700" y="380" width="320" height="60" rx="8" fill="#fefce8" stroke="#ca8a04"/>
  <text x="860" y="404" text-anchor="middle" font-size="13" font-weight="bold" fill="#854d0e">/metrics (admin key)</text>
  <text x="860" y="422" text-anchor="middle" font-size="11" fill="#a16207">per-provider stats + circuit state + rate_limited_total</text>

  <!-- request_log -->
  <rect x="700" y="470" width="320" height="60" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="860" y="496" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">request_log</text>
  <text x="860" y="514" text-anchor="middle" font-size="11" fill="#475569">every attempt: success / failed / rate_limited · 30d retention</text>

  <!-- Arrows: client -> auth -->
  <line x1="180" y1="280" x2="264" y2="145" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <!-- auth -> rate -->
  <line x1="420" y1="164" x2="420" y2="184" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <!-- rate -> router -->
  <line x1="420" y1="244" x2="420" y2="264" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <!-- router -> groq -->
  <line x1="570" y1="290" x2="694" y2="150" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrg)"/>
  <text x="622" y="200" font-size="10" fill="#166534" transform="rotate(-23 622 200)">healthy</text>
  <!-- router -> mock -->
  <line x1="570" y1="300" x2="694" y2="215" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrr)"/>
  <text x="600" y="270" font-size="10" fill="#991b1b">circuit open / slow → skip</text>
  <!-- router -> next provider -->
  <line x1="570" y1="310" x2="694" y2="295" stroke="#64748b" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#arr)"/>
  <!-- auth -> postgres -->
  <line x1="340" y1="164" x2="350" y2="464" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="322" y="470" font-size="10" fill="#64748b">lookup</text>
  <!-- rate -> redis -->
  <line x1="290" y1="216" x2="190" y2="464" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="176" y="350" font-size="10" fill="#64748b">bucket</text>
  <!-- router -> redis -->
  <line x1="300" y1="300" x2="190" y2="500" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="206" y="456" font-size="10" fill="#64748b">circuit</text>
  <!-- providers -> request_log -->
  <line x1="860" y1="164" x2="780" y2="464" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrg)"/>
  <line x1="730" y1="217" x2="770" y2="464" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="736" y="440" font-size="10" fill="#166534">success / fail</text>
  <!-- request_log -> metrics -->
  <line x1="860" y1="470" x2="902" y2="446" stroke="#ca8a04" stroke-width="1.4" marker-end="url(#arr)"/>
  <!-- postgres -> metrics -->
  <line x1="546" y1="500" x2="694" y2="440" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <!-- Legend -->
  <rect x="40" y="70" width="160" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="50" y="92" font-size="12" font-weight="bold" fill="#0f172a">Legend</text>
  <line x1="50" y1="112" x2="90" y2="112" stroke="#16a34a" stroke-width="2.2"/>
  <text x="98" y="116" font-size="11" fill="#334155">happy path</text>
  <line x1="50" y1="132" x2="90" y2="132" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4 3"/>
  <text x="98" y="136" font-size="11" fill="#334155">circuit open / skip</text>
  <line x1="50" y1="152" x2="90" y2="152" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="98" y="156" font-size="11" fill="#334155">state / store</text>
  <line x1="50" y1="172" x2="90" y2="172" stroke="#64748b" stroke-width="1.6"/>
  <text x="98" y="176" font-size="11" fill="#334155">HTTP / data</text>

  <text x="540" y="620" text-anchor="middle" font-size="11" fill="#94a3b8">Postgres holds configuration, Redis is ephemeral state — add a provider/client with one INSERT, no redeploy</text>
</svg>