# Render blueprint — one-click deploy
#
# 1. Create a Postgres database service in Render and copy its "Internal
#    Database URL" into DATABASE_URL below.
# 2. Provide REDIS_URL from a Redis provider (Render preview, Upstash,
#    Redis Cloud…) or self-host.
# 3. Set GROQ_API_KEY (optional) and ADMIN_API_KEY.
# 4. Push to GitHub and create a new Blueprint from this file.
#    On first deploy the app auto-runs migrations only on fresh postgres;
#    for an existing DB run `npm run migrate` via a Render Shell/console.

services:
  - type: web
    name: llm-gateway
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false            # set manually — external service
      - key: REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: SEED_CLIENT_KEY
        sync: false      # optional: raw key; gateway creates this client on boot
      - key: SEED_CLIENT_NAME
        value: seed-client
      - key: SEED_BUCKET_SIZE
        value: "20"
      - key: SEED_REFILL_RATE
        value: "5"
      - key: RATE_LIMIT_FAIL_OPEN
        value: "false"         # fail closed in prod — never allow unmetered traffic
      - key: LOG_RETENTION_DAYS
        value: "30"
      - key: METRICS_WINDOW_DAYS
        value: "30"
      - key: AUTH_MAX_FAILURES
        value: "5"
      - key: AUTH_FAIL_WINDOW_SECONDS
        value: "60"